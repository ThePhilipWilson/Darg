<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>__TITLE__</title>
<style>
 body{margin:0;background:#0e0f13;color:#e7e9ee;font-family:system-ui,Segoe UI,sans-serif}
 header{position:sticky;top:0;z-index:20;background:#15161b;border-bottom:1px solid #2a2e3a;padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
 h1{font-size:16px;margin:0} .prog{font-size:13px;color:#9ad} .lab{font-size:11px;color:#9aa0ad} .sent{font-size:12px;color:#9c9}
 .sent.bad{color:#e88}
 .bigbtn{background:#9c6b1f;color:#fff6e6;border:0;padding:8px 14px;border-radius:6px;font-weight:700;cursor:pointer;font-size:13px}
 .btn{background:#2a2e3a;color:#e7e9ee;border:0;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px}
 .pagenote{margin:12px 16px 0;font-size:13px;color:#c9ccd4;white-space:pre-wrap}
 h2{margin:24px 16px 2px;font-size:15px} h2 .note{font-size:12px;color:#9aa0ad;font-weight:400}
 h2 .state{font-size:11px;font-weight:600;margin-left:8px;color:#e0a23a} h2 .state.ok{color:#9c9}
 .row{display:flex;gap:12px;overflow-x:auto;padding:10px 16px 20px}
 .cand{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;border:2px solid transparent;border-radius:10px;padding:6px}
 .cand.sel{border-color:#d9a441;background:#241d10} .cand.orig .lab{color:#e0a23a}
 .cand img{display:block;border-radius:6px;height:min(440px,70vh);max-width:86vw;object-fit:contain;background:#1a1b20}
 .cand .missing{height:200px;width:160px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:#e88;border:1px dashed #533;border-radius:6px;padding:6px}
 .why{margin:0 16px 4px;width:calc(100% - 32px);max-width:640px;box-sizing:border-box;background:#15161b;color:#e7e9ee;border:1px solid #3a3f4d;border-radius:6px;padding:8px;font:13px system-ui,Segoe UI,sans-serif}
 .why:placeholder-shown{border-color:#2a2e3a}
 #big{position:fixed;inset:0;background:rgba(5,5,8,.94);z-index:60;display:none;flex-direction:column}
 #big .bar{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#15161b}
 #big .bar .lab{flex:1}
 #big .pic{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center}
 #big img{max-width:none;cursor:zoom-out}
 .err{margin:24px 16px;color:#e88;white-space:pre-wrap;font:13px monospace}
</style></head><body>
<header><h1>__TITLE__</h1><span class="prog" id="prog"></span><button class="bigbtn" onclick="send()">Send picks</button><span class="sent" id="sent"></span>
<span class="lab">tap to pick; no pick = needs another pass; tap a picked image again to see it full size</span></header>
<div id="content"></div>
<div id="big"><div class="bar"><span class="lab" id="bigname"></span><button class="btn" id="unpick">Unpick</button><button class="btn" onclick="closeBig()">Close (Esc)</button></div><div class="pic" onclick="closeBig()"><img id="bigimg"></div></div>
<script>
const DATA = __DATA__;
const ERROR = __ERROR__;
const LS = "workbench_review:" + location.pathname;
const ROWS = (DATA && (DATA.rows || DATA.jobs)) || [];
let picks = {}; try { picks = JSON.parse(localStorage.getItem(LS) || "{}"); } catch (e) {}
let notes = {}; try { notes = JSON.parse(localStorage.getItem(LS + "_notes") || "{}"); } catch (e) {}
function save(){ try { localStorage.setItem(LS, JSON.stringify(picks)); localStorage.setItem(LS + "_notes", JSON.stringify(notes)); } catch (e) {} }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]); }
function absolute(p){ return /^[A-Za-z]:[\\/]/.test(p) || p.startsWith("/") || p.startsWith("\\\\"); }
function full(p){
  p = String(p || "");
  if (!absolute(p) && DATA && DATA.folder) p = String(DATA.folder).replace(/[\\/]+$/, "") + "/" + p;
  return p.replace(/\\/g, "/");
}
function src(p){ return "/file/" + full(p).split("/").filter(s => s.length).map(encodeURIComponent).join("/"); }
function base(p){ return full(p).split("/").pop(); }
// what a pick is called in the reply: the file's name, or its path as given if another candidate in the row shares the name
function name(r, f){
  if (f === r.original) return "original";
  const same = (r.candidates || []).filter(c => base(c) === base(f)).length;
  return same > 1 ? f : base(f);
}
function pick(r, f){ if (picks[r.id] === f) openBig(r, f); else { picks[r.id] = f; save(); render(); } }
function cand(r, f, label, orig){
  const d = document.createElement("div"); d.className = "cand" + (orig ? " orig" : "") + (picks[r.id] === f ? " sel" : "");
  const img = document.createElement("img"); img.loading = "lazy"; img.src = src(f);
  img.onerror = () => { const m = document.createElement("div"); m.className = "missing"; m.textContent = "can't show " + full(f); img.replaceWith(m); };
  const lab = document.createElement("div"); lab.className = "lab"; lab.textContent = label;
  d.appendChild(img); d.appendChild(lab); d.onclick = () => pick(r, f); return d;
}
function render(){
  const c = document.getElementById("content"); c.innerHTML = "";
  if (ERROR) { const e = document.createElement("div"); e.className = "err"; e.textContent = ERROR; c.appendChild(e); }
  if (DATA && DATA.note) { const n = document.createElement("div"); n.className = "pagenote"; n.textContent = DATA.note; c.appendChild(n); }
  for (const r of ROWS){
    const h = document.createElement("h2");
    const chosen = picks[r.id];
    h.innerHTML = esc(r.id) + ' <span class="note">' + esc(r.note) + '</span>'
      + '<span class="state' + (chosen ? ' ok' : '') + '">' + (chosen ? esc(name(r, chosen)) : 'needs pass') + '</span>';
    c.appendChild(h);
    const row = document.createElement("div"); row.className = "row";
    if (r.original) row.appendChild(cand(r, r.original, "original", true));
    for (const f of (r.candidates || [])) row.appendChild(cand(r, f, base(f), false));
    c.appendChild(row);
    // what's wrong, for a row left unpicked or kept as the original (goes into the reply after a |)
    const why = document.createElement("input"); why.className = "why"; why.value = notes[r.id] || "";
    why.placeholder = "what's wrong? (for none / original)";
    why.oninput = () => { notes[r.id] = why.value; save(); };
    c.appendChild(why);
  }
  const n = ROWS.filter(r => picks[r.id]).length;
  document.getElementById("prog").textContent = n + " / " + ROWS.length + " picked";
}
let bigRow = null;
function openBig(r, f){
  bigRow = r;
  document.getElementById("bigimg").src = src(f);
  document.getElementById("bigname").textContent = r.id + ": " + full(f);
  document.getElementById("big").style.display = "flex";
}
function closeBig(){ document.getElementById("big").style.display = "none"; bigRow = null; }
document.getElementById("unpick").onclick = () => { if (bigRow) { delete picks[bigRow.id]; save(); closeBig(); render(); } };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeBig(); });
function lines(){
  return ROWS.map(r => r.id + ": " + (picks[r.id] ? name(r, picks[r.id]) : "NEEDS PASS")
    + ((notes[r.id] || "").trim() ? " | " + notes[r.id].trim().replace(/\s+/g, " ") : "")).join(String.fromCharCode(10));
}
async function send(){
  const s = document.getElementById("sent");
  s.className = "sent"; s.textContent = "sending...";
  const ok = window.workbench ? await window.workbench.send(lines()) : false;
  s.className = ok ? "sent" : "sent bad";
  s.textContent = ok ? "sent " + new Date().toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"}) : (window.workbench ? "not sent: is Workbench running?" : "not sent: open this from Workbench");
}
render();
</script></body></html>
